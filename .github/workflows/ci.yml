name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run check
      - run: pixi run build-windows
