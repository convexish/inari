[package]
name = "inari"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Inari: the desktop table for Innovation with every supported expansion"

[[bin]]
name = "inari"
path = "src/main.rs"

[dependencies]
inno-engine = { path = "../engine" }
macroquad = { version = "=0.4.16", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
